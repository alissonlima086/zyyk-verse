name: Publish release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: write

jobs:
  publish:
    name: Publicar artefato validado
    runs-on: ubuntu-22.04
    timeout-minutes: 35

    steps:
      - name: Checkout da tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validar tag, versões e origem
        shell: bash
        run: |
          package_version="$(node --print "require('./package.json').version")"
          tauri_version="$(node --print "require('./src-tauri/tauri.conf.json').version")"
          cargo_version="$(sed -n '/^\[package\]/,/^\[/s/^version = "\([^"]*\)"/\1/p' src-tauri/Cargo.toml | head -1)"
          expected_tag="v${package_version}"
          if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
            echo "A tag ${GITHUB_REF_NAME} não corresponde à versão ${package_version}." >&2
            exit 1
          fi
          if ! [[ "$package_version" == "$tauri_version" && "$package_version" == "$cargo_version" ]]; then
            echo "Versões divergentes: package=${package_version}, tauri=${tauri_version}, cargo=${cargo_version}." >&2
            exit 1
          fi
          if ! git branch --remotes --contains "$GITHUB_SHA" | grep --quiet 'origin/main'; then
            echo "A tag precisa apontar para um commit presente em main." >&2
            exit 1
          fi

      - name: Aguardar candidato do mesmo commit
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          for attempt in {1..120}; do
            run="$({ gh api --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/build.yml/runs" \
              -f branch=main \
              -f "head_sha=${GITHUB_SHA}" \
              -f per_page=10 \
              --jq '.workflow_runs[] | [.id, .status, (.conclusion // "")] | @tsv' || true; } | head -1)"
            if [[ -z "$run" ]]; then
              echo "Candidato ainda não registrado (${attempt}/120)."
              sleep 15
              continue
            fi

            IFS=$'\t' read -r run_id status conclusion <<< "$run"
            if [[ "$status" != "completed" ]]; then
              echo "Candidato ${run_id} ainda está ${status} (${attempt}/120)."
              sleep 15
              continue
            fi
            if [[ "$conclusion" != "success" ]]; then
              echo "A construção do candidato ${run_id} terminou com ${conclusion}." >&2
              exit 1
            fi

            echo "run-id=${run_id}" >> "$GITHUB_OUTPUT"
            echo "Promovendo artefato validado da execução ${run_id}."
            exit 0
          done
          echo "Nenhum candidato válido para ${GITHUB_SHA} ficou pronto em 30 minutos." >&2
          exit 1

      - name: Baixar artefato validado
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.0
        with:
          pattern: zyyk-verse-linux-*
          path: release-assets
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.candidate.outputs.run-id }}

      - name: Validar checksums
        shell: bash
        run: |
          shopt -s nullglob
          artifact_directories=(release-assets/zyyk-verse-linux-*)
          if [[ "${#artifact_directories[@]}" -ne 2 ]]; then
            echo "Esperados dois artefatos Linux; encontrados ${#artifact_directories[@]}." >&2
            exit 1
          fi
          for directory in "${artifact_directories[@]}"; do
            (cd "$directory" && sha256sum --check SHA256SUMS)
          done

      - name: Criar GitHub Release imutável
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "A release $GITHUB_REF_NAME já existe; recusando substituir artefatos publicados." >&2
            exit 1
          fi
          shopt -s nullglob
          applications=(release-assets/zyyk-verse-linux-*/*.AppImage)
          architecture_sources=(release-assets/zyyk-verse-linux-*/ZYYK-Verse-*-third-party-copyleft-sources.tar.gz)
          if [[ "${#applications[@]}" -ne 2 || "${#architecture_sources[@]}" -ne 2 ]]; then
            echo "Esperados dois AppImages e dois pacotes copyleft intermediários; encontrados ${#applications[@]} e ${#architecture_sources[@]}." >&2
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          consolidated="$RUNNER_TEMP/ZYYK-Verse-${version}-third-party-copyleft-sources.tar.gz"
          release_notes="$RUNNER_TEMP/release-notes.md"
          bash .github/compliance/consolidate-copyleft-sources.sh \
            "$consolidated" "${architecture_sources[@]}"
          awk -v version="$version" '
            $0 ~ "^## \\[" version "\\]" { capture = 1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md > "$release_notes"
          if [[ ! -s "$release_notes" ]]; then
            echo "Notas da versão ${version} não encontradas no CHANGELOG.md." >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" "${applications[@]}" "$consolidated" \
            --verify-tag \
            --notes-file "$release_notes" \
            --title "ZYYK Verse ${GITHUB_REF_NAME#v}"
