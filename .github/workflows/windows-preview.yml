name: Windows preview

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/windows-preview.yml"
      - "src/**"
      - "src-tauri/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - "tsconfig.json"

concurrency:
  group: windows-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Windows x64 NSIS (unsigned)
    runs-on: windows-2022
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Configure Rust MSVC
        uses: dtolnay/rust-toolchain@7dcc700092a1a8b9c17ba0e140b4e34e93000946 # 1.90.0
        with:
          targets: x86_64-pc-windows-msvc

      - name: Restore Rust and Tauri cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cache/tauri
            src-tauri/target
          key: ${{ runner.os }}-${{ runner.arch }}-preview-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-preview-

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Validate sources on Windows
        run: |
          npm run test
          npm run check
          npm audit --audit-level=high
          cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Build unsigned NSIS preview
        run: npm run tauri -- build --bundles nsis --ci

      - name: Validate installer and checksum
        id: installer
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe")
          if ($installers.Count -ne 1) {
            throw "Expected exactly one NSIS installer; found $($installers.Count)."
          }
          $installer = $installers[0]
          $checksum = (Get-FileHash -Algorithm SHA256 $installer.FullName).Hash.ToLowerInvariant()
          "$checksum  $($installer.Name)" | Set-Content -Encoding ascii "$($installer.DirectoryName)/SHA256SUMS"
          "path=$($installer.DirectoryName)" >> $env:GITHUB_OUTPUT

      - name: Upload unsigned preview
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zyyk-verse-windows-x86_64-unsigned
          path: |
            ${{ steps.installer.outputs.path }}/*-setup.exe
            ${{ steps.installer.outputs.path }}/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
