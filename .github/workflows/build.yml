name: Build release candidate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build.yml"
      - ".github/compliance/**"
      - "src/**"
      - "src-tauri/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - "tsconfig.json"
      - "LICENSE"

concurrency:
  group: release-candidate-main
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_ABOUT_VERSION: 0.9.2
  CARGO_AUDIT_VERSION: 0.22.2
  SYFT_VERSION: 1.55.0

jobs:
  release-state:
    name: Verificar versão
    runs-on: ubuntu-22.04
    outputs:
      should-build: ${{ steps.release.outputs.should-build }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verificar se a versão precisa de artefato
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="$(node --print "require('./package.json').version")"
          tag="v${version}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "Build manual solicitado para ${tag}."
            echo "should-build=true" >> "$GITHUB_OUTPUT"
          elif gh release view "$tag" >/dev/null 2>&1; then
            echo "${tag} já foi publicada; nenhuma compilação pesada é necessária."
            echo "should-build=false" >> "$GITHUB_OUTPUT"
          else
            echo "${tag} ainda não foi publicada; preparando candidato."
            echo "should-build=true" >> "$GITHUB_OUTPUT"
          fi

  build-appimage:
    name: Linux ${{ matrix.label }}
    needs: release-state
    if: needs.release-state.outputs.should-build == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: x86_64
            artifact_arch: x86_64
            runner: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
            debian_triplet: x86_64-linux-gnu
            tool_arch: amd64
            cargo_audit_target: x86_64-unknown-linux-musl
            cargo_audit_sha256: 7fb9497f8594b389e5fce5ef9b92db08432996895b2e0c5a0167a69ed445c428
            syft_sha256: bb65249542db5fedeeb4d3f9b018b75e7264dbfbbb10486f044581a92f90490d
            release_arch: amd64
          - label: ARM64
            artifact_arch: aarch64
            runner: ubuntu-22.04-arm
            rust_target: aarch64-unknown-linux-gnu
            debian_triplet: aarch64-linux-gnu
            tool_arch: arm64
            cargo_audit_target: aarch64-unknown-linux-gnu
            cargo_audit_sha256: c6603814ddaa45e51263dafd31c0ac98808f688d26f7395804f9670b0fd599dd
            syft_sha256: 929bd163db2d7cd2255d3bcb8967208079813d7b46b0c952f7b794d8e2c7d304
            release_arch: arm64
    env:
      ZYYK_RUST_TARGET: ${{ matrix.rust_target }}
      ZYYK_RELEASE_ARCH: ${{ matrix.release_arch }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Configurar Rust
        uses: dtolnay/rust-toolchain@7dcc700092a1a8b9c17ba0e140b4e34e93000946 # 1.90.0

      - name: Restaurar cache Rust e Tauri
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/bin/cargo-about
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cache/tauri
            src-tauri/target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-release-${{ hashFiles('src-tauri/Cargo.lock') }}-about-${{ env.CARGO_ABOUT_VERSION }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-release-${{ hashFiles('src-tauri/Cargo.lock') }}-
            ${{ runner.os }}-${{ runner.arch }}-cargo-

      - name: Habilitar repositórios de código-fonte do Ubuntu
        shell: bash
        run: |
          sed -n 's/^deb /deb-src /p' /etc/apt/sources.list | sudo tee /etc/apt/sources.list.d/zyyk-deb-src.list >/dev/null

      - name: Instalar dependências do sistema
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          # Alinha binários e fontes do Ubuntu para preservar o código-fonte
          # correspondente exato que acompanha a distribuição.
          sudo --preserve-env=DEBIAN_FRONTEND apt-get upgrade \
            --yes --with-new-pkgs --no-install-recommends \
            -o APT::Get::Always-Include-Phased-Updates=true
          sudo --preserve-env=DEBIAN_FRONTEND apt-get install \
            --yes --no-install-recommends \
            -o APT::Get::Always-Include-Phased-Updates=true \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf \
            pkg-config \
            squashfs-tools \
            xdg-utils \
            gstreamer1.0-tools \
            gstreamer1.0-alsa \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad

      - name: Instalar ferramentas de auditoria fixadas
        shell: bash
        run: |
          if ! cargo about --version 2>/dev/null | grep --fixed-strings --quiet "$CARGO_ABOUT_VERSION"; then
            cargo install --locked --version "$CARGO_ABOUT_VERSION" --features cli cargo-about
          fi
          curl --fail --location --silent --show-error \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_${{ matrix.tool_arch }}.tar.gz" \
            --output /tmp/syft.tar.gz
          echo "${{ matrix.syft_sha256 }}  /tmp/syft.tar.gz" | sha256sum --check
          sudo tar -xzf /tmp/syft.tar.gz -C /usr/local/bin syft
          cargo_audit_archive="cargo-audit-${{ matrix.cargo_audit_target }}-v${CARGO_AUDIT_VERSION}"
          curl --fail --location --silent --show-error \
            "https://github.com/rustsec/rustsec/releases/download/cargo-audit/v${CARGO_AUDIT_VERSION}/${cargo_audit_archive}.tgz" \
            --output /tmp/cargo-audit.tar.gz
          echo "${{ matrix.cargo_audit_sha256 }}  /tmp/cargo-audit.tar.gz" | sha256sum --check
          tar -xzf /tmp/cargo-audit.tar.gz -C /tmp \
            "${cargo_audit_archive}/cargo-audit"
          sudo install -m 0755 \
            "/tmp/${cargo_audit_archive}/cargo-audit" \
            /usr/local/bin/cargo-audit
          cargo about --version
          syft version
          cargo audit --version

      - name: Instalar dependências JavaScript
        run: npm ci

      - name: Validar versões do projeto
        shell: bash
        run: |
          package_version="$(node --print "require('./package.json').version")"
          tauri_version="$(node --print "require('./src-tauri/tauri.conf.json').version")"
          cargo_version="$(sed -n '/^\[package\]/,/^\[/s/^version = "\([^"]*\)"/\1/p' src-tauri/Cargo.toml | head -1)"
          if ! [[ "$package_version" == "$tauri_version" && "$package_version" == "$cargo_version" ]]; then
            echo "Versões divergentes: package=${package_version}, tauri=${tauri_version}, cargo=${cargo_version}." >&2
            exit 1
          fi

      - name: Validar código-fonte
        run: |
          npm run test
          npm run check
          npm audit --audit-level=high
          cargo test --manifest-path src-tauri/Cargo.toml --locked
          cargo audit --file src-tauri/Cargo.lock

      - name: Preparar conjunto mínimo do GStreamer
        shell: bash
        run: |
          plugin_dir="$GITHUB_WORKSPACE/.compliance/gstreamer-plugins"
          bash .github/compliance/prepare-gstreamer-plugins.sh \
            "/usr/lib/${{ matrix.debian_triplet }}/gstreamer-1.0" "$plugin_dir" \
            "$GITHUB_WORKSPACE/.compliance/gstreamer-plugin-licenses.tsv"
          echo "GSTREAMER_PLUGINS_DIR=$plugin_dir" >> "$GITHUB_ENV"

      - name: Gerar avisos das crates de execução
        shell: bash
        working-directory: src-tauri
        run: |
          mkdir -p ../.compliance
          sed "s|^targets = .*|targets = [\"${ZYYK_RUST_TARGET}\"]|" \
            ../.github/compliance/about.toml > ../.compliance/about.toml
          cargo about generate \
            --locked \
            --fail \
            --config ../.compliance/about.toml \
            --output-file ../.compliance/rust-notices.md \
            ../.github/compliance/rust-notices.hbs

      - name: Preparar primeira passagem
        run: node .github/compliance/audit.mjs bootstrap

      - name: Limpar AppImages restaurados do cache
        shell: bash
        run: rm -rf src-tauri/target/release/bundle/appimage

      - name: Compilar AppImage para inspeção
        run: npm run tauri -- build --bundles appimage

      - name: Inspecionar componentes efetivamente distribuídos
        shell: bash
        run: |
          shopt -s nullglob
          appimage=(src-tauri/target/release/bundle/appimage/*.AppImage)
          if [[ "${#appimage[@]}" -ne 1 ]]; then
            echo "Era esperado exatamente um AppImage; encontrados: ${#appimage[@]}" >&2
            exit 1
          fi
          bash .github/compliance/extract-appimage.sh "${appimage[0]}" .compliance/pass1.AppDir
          bash .github/compliance/stage-native-copyright.sh .compliance/pass1.AppDir
          syft dir:.compliance/pass1.AppDir \
            --exclude './usr/share/doc/zyyk-verse/**' \
            --select-catalogers '-sbom-cataloger' \
            --source-name zyyk-verse \
            --source-version "$(node --print "require('./package.json').version")" \
            --output spdx-json=.compliance/pass1.spdx.json
          node .github/compliance/audit.mjs generate \
            --appdir .compliance/pass1.AppDir \
            --sbom .compliance/pass1.spdx.json \
            --plugin-policy .compliance/gstreamer-plugin-licenses.tsv \
            --rust-notices .compliance/rust-notices.md

      - name: Preservar código-fonte correspondente
        shell: bash
        run: |
          version="$(node --print "require('./package.json').version")"
          bash .github/compliance/collect-copyleft-sources.sh \
            ".compliance/ZYYK-Verse-${version}-${ZYYK_RELEASE_ARCH}-third-party-copyleft-sources.tar.gz" \
            "$ZYYK_RELEASE_ARCH"

      - name: Reempacotar AppImage com documentação auditada
        run: npm run tauri -- bundle --bundles appimage --ci

      - name: Validar AppImage final
        shell: bash
        run: |
          shopt -s nullglob
          appimage=(src-tauri/target/release/bundle/appimage/*.AppImage)
          if [[ "${#appimage[@]}" -ne 1 ]]; then
            echo "Era esperado exatamente um AppImage final; encontrados: ${#appimage[@]}" >&2
            exit 1
          fi
          bash .github/compliance/extract-appimage.sh "${appimage[0]}" .compliance/final.AppDir
          syft dir:.compliance/final.AppDir \
            --exclude './usr/share/doc/zyyk-verse/**' \
            --select-catalogers '-sbom-cataloger' \
            --source-name zyyk-verse \
            --source-version "$(node --print "require('./package.json').version")" \
            --output spdx-json=.compliance/final.spdx.json
          node .github/compliance/audit.mjs validate \
            --appdir .compliance/final.AppDir \
            --sbom .compliance/final.spdx.json \
            --plugin-policy .compliance/gstreamer-plugin-licenses.tsv

      - name: Preparar artefatos da release
        shell: bash
        run: |
          version="$(node --print "require('./package.json').version")"
          bundle_dir="src-tauri/target/release/bundle/appimage"
          cp ".compliance/ZYYK-Verse-${version}-${ZYYK_RELEASE_ARCH}-third-party-copyleft-sources.tar.gz" "$bundle_dir/"
          cp .compliance/THIRD_PARTY_NOTICES.md "$bundle_dir/"
          cp .compliance/SOURCE_OFFER.md "$bundle_dir/"
          cp .compliance/SBOM.spdx.json "$bundle_dir/"
          cp .compliance/AUDIT_REPORT.md "$bundle_dir/"
          cd "$bundle_dir"
          sha256sum -- *.AppImage *.md *.json *.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Publicar candidato do commit
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zyyk-verse-linux-${{ matrix.artifact_arch }}
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.md
            src-tauri/target/release/bundle/appimage/*.json
            src-tauri/target/release/bundle/appimage/*.tar.gz
            src-tauri/target/release/bundle/appimage/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  build-windows:
    name: Windows x64 NSIS (unsigned)
    needs: release-state
    if: needs.release-state.outputs.should-build == 'true'
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Configure Rust MSVC
        uses: dtolnay/rust-toolchain@7dcc700092a1a8b9c17ba0e140b4e34e93000946 # 1.90.0
        with:
          targets: x86_64-pc-windows-msvc

      - name: Restore Rust and Tauri cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cache/tauri
            src-tauri/target
          key: ${{ runner.os }}-${{ runner.arch }}-candidate-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-candidate-
            ${{ runner.os }}-${{ runner.arch }}-preview-

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Validate versions
        shell: pwsh
        run: |
          $packageVersion = node --print "require('./package.json').version"
          $tauriVersion = node --print "require('./src-tauri/tauri.conf.json').version"
          $cargoVersion = cargo metadata --manifest-path src-tauri/Cargo.toml --no-deps --format-version 1 | ConvertFrom-Json | Select-Object -ExpandProperty packages | Select-Object -First 1 -ExpandProperty version
          if ($packageVersion -ne $tauriVersion -or $packageVersion -ne $cargoVersion) {
            throw "Version mismatch: package=$packageVersion tauri=$tauriVersion cargo=$cargoVersion"
          }

      - name: Validate sources on Windows
        run: |
          npm run test
          npm run check
          npm audit --audit-level=high
          cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Remove NSIS bundles restored from cache
        shell: pwsh
        run: |
          if (Test-Path "src-tauri/target/release/bundle/nsis") {
            Remove-Item "src-tauri/target/release/bundle/nsis" -Recurse -Force
          }

      - name: Build unsigned NSIS candidate
        run: npm run tauri -- build --bundles nsis --ci

      - name: Validate unsigned installer
        id: installer
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe")
          if ($installers.Count -ne 1) {
            throw "Expected exactly one NSIS installer; found $($installers.Count)."
          }
          $installer = $installers[0]
          $signature = Get-AuthenticodeSignature $installer.FullName
          if ($signature.Status -ne "NotSigned") {
            throw "The zero-cost Windows candidate must be explicitly unsigned; status is $($signature.Status)."
          }
          "path=$($installer.FullName)" >> $env:GITHUB_OUTPUT

      - name: Upload NSIS for compliance packaging
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-nsis-intermediate
          path: ${{ steps.installer.outputs.path }}
          if-no-files-found: error
          retention-days: 2

  package-windows:
    name: Windows x64 compliance
    needs: [release-state, build-windows]
    if: needs.release-state.outputs.should-build == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      ZYYK_RUST_TARGET: x86_64-pc-windows-msvc
      ZYYK_RELEASE_ARCH: windows-x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Configure Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Configure Rust
        uses: dtolnay/rust-toolchain@7dcc700092a1a8b9c17ba0e140b4e34e93000946 # 1.90.0

      - name: Restore Cargo compliance cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/bin/cargo-about
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-windows-compliance-${{ hashFiles('src-tauri/Cargo.lock') }}-about-${{ env.CARGO_ABOUT_VERSION }}
          restore-keys: |
            ${{ runner.os }}-windows-compliance-${{ hashFiles('src-tauri/Cargo.lock') }}-
            ${{ runner.os }}-cargo-

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Install pinned cargo-about
        shell: bash
        run: |
          if ! cargo about --version 2>/dev/null | grep --fixed-strings --quiet "$CARGO_ABOUT_VERSION"; then
            cargo install --locked --version "$CARGO_ABOUT_VERSION" --features cli cargo-about
          fi
          cargo about --version

      - name: Download Windows installer from this commit
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.0
        with:
          name: windows-nsis-intermediate
          path: windows-release

      - name: Validate downloaded installer
        id: installer
        shell: bash
        run: |
          shopt -s nullglob
          installers=(windows-release/*-setup.exe)
          if [[ "${#installers[@]}" -ne 1 ]]; then
            echo "Expected exactly one downloaded NSIS installer; found ${#installers[@]}." >&2
            exit 1
          fi
          echo "path=${installers[0]}" >> "$GITHUB_OUTPUT"

      - name: Build frontend inventory
        run: npm run build

      - name: Generate Windows Rust notices
        shell: bash
        working-directory: src-tauri
        run: |
          mkdir -p ../.compliance/windows
          sed 's|^targets = .*|targets = ["x86_64-pc-windows-msvc"]|' \
            ../.github/compliance/about.toml > ../.compliance/windows/about.toml
          cargo about generate \
            --locked \
            --fail \
            --config ../.compliance/windows/about.toml \
            --output-file ../.compliance/windows/rust-notices.md \
            ../.github/compliance/rust-notices.hbs

      - name: Fetch pinned Windows packaging notices
        shell: bash
        run: |
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/NSIS-Dev/nsis/v313/COPYING \
            --output .compliance/windows/NSIS-COPYING
          echo "6cc665347be5c84b76bf0fd6f85fbb0c33261e89b3408aa3e3e55dbe95e12d89  .compliance/windows/NSIS-COPYING" | sha256sum --check
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/tauri-apps/nsis-tauri-utils/nsis_tauri_utils-v0.5.3/LICENSE_MIT \
            --output .compliance/windows/NSIS-TAURI-UTILS-LICENSE-MIT
          echo "1c1020fa10a6bf318717e82c911bcc54ebdfb9bb280460ae332bcb2f82f57fbe  .compliance/windows/NSIS-TAURI-UTILS-LICENSE-MIT" | sha256sum --check
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/tauri-apps/nsis-tauri-utils/nsis_tauri_utils-v0.5.3/LICENSE_APACHE-2.0 \
            --output .compliance/windows/NSIS-TAURI-UTILS-LICENSE-APACHE
          echo "0d542e0c8804e39aa7f37eb00da5a762149dc682d7829451287e11b938e94594  .compliance/windows/NSIS-TAURI-UTILS-LICENSE-APACHE" | sha256sum --check

      - name: Generate Windows compliance documents
        shell: bash
        run: |
          node .github/compliance/windows-audit.mjs \
            --installer "${{ steps.installer.outputs.path }}" \
            --frontend-inventory .compliance/frontend-packages.json \
            --rust-notices .compliance/windows/rust-notices.md \
            --nsis-notice .compliance/windows/NSIS-COPYING \
            --utils-mit-notice .compliance/windows/NSIS-TAURI-UTILS-LICENSE-MIT \
            --utils-apache-notice .compliance/windows/NSIS-TAURI-UTILS-LICENSE-APACHE \
            --output-dir .compliance/windows

      - name: Preserve corresponding copyleft sources
        shell: bash
        run: |
          version="$(node --print "require('./package.json').version")"
          bash .github/compliance/collect-copyleft-sources.sh \
            ".compliance/windows/ZYYK-Verse-${version}-windows-x86_64-third-party-copyleft-sources.tar.gz" \
            windows-x86_64 \
            .compliance/windows

      - name: Prepare final Windows candidate
        shell: bash
        run: |
          cp LICENSE windows-release/
          cp .compliance/windows/THIRD_PARTY_NOTICES.md windows-release/
          cp .compliance/windows/SOURCE_OFFER.md windows-release/
          cp .compliance/windows/SBOM.spdx.json windows-release/
          cp .compliance/windows/AUDIT_REPORT.md windows-release/
          cp .compliance/windows/ZYYK-Verse-*-third-party-copyleft-sources.tar.gz windows-release/
          cd windows-release
          sha256sum -- *.exe *.md *.json *.tar.gz > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Publish Windows candidate for this commit
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zyyk-verse-windows-x86_64
          path: |
            windows-release/*-setup.exe
            windows-release/*.md
            windows-release/*.json
            windows-release/*.tar.gz
            windows-release/LICENSE
            windows-release/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
