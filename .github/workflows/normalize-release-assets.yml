name: Normalize release assets

on:
  push:
    branches: [main]
    paths: [".github/workflows/normalize-release-assets.yml"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to normalize
        required: true
        default: v0.1.0
        type: string

permissions:
  contents: write

jobs:
  normalize:
    name: Consolidate source assets
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag || 'v0.1.0' }}

    steps:
      - name: Consolidate source package and remove auxiliary assets
        shell: bash
        run: |
          set -Eeuo pipefail
          shopt -s nullglob

          version="${RELEASE_TAG#v}"
          final_name="ZYYK-Verse-${version}-source.tar.gz"
          copyleft_name="ZYYK-Verse-${version}-copyleft-sources.tar.gz"
          replacement_name="${final_name}.replacement"
          work_dir="$RUNNER_TEMP/normalize-release"
          incoming_dir="$work_dir/incoming"
          source_root="$work_dir/ZYYK-Verse-${version}-source"
          mkdir -p "$incoming_dir" "$source_root/third-party-sources" "$source_root/compliance"

          asset_names="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
          if ! grep -Fxq -- "$copyleft_name" <<<"$asset_names"; then
            unexpected="$(grep -Ev "^(ZYYK\\.Verse_.*\\.AppImage|${final_name})$" <<<"$asset_names" || true)"
            if [[ -z "$unexpected" ]]; then
              echo "A release $RELEASE_TAG já está normalizada."
              exit 0
            fi
            echo "O pacote copyleft necessário para consolidar as fontes não foi encontrado." >&2
            exit 1
          fi

          gh release download "$RELEASE_TAG" --dir "$incoming_dir" \
            --pattern "$final_name" \
            --pattern "$copyleft_name" \
            --pattern THIRD_PARTY_NOTICES.md \
            --pattern SOURCE_OFFER.md \
            --pattern SBOM.spdx.json \
            --pattern AUDIT_REPORT.md

          test -s "$incoming_dir/$final_name"
          test -s "$incoming_dir/$copyleft_name"
          tar -xzf "$incoming_dir/$final_name" -C "$source_root" --strip-components=1
          tar -xzf "$incoming_dir/$copyleft_name" \
            -C "$source_root/third-party-sources" --strip-components=1
          cp "$incoming_dir/THIRD_PARTY_NOTICES.md" "$source_root/compliance/"
          cp "$incoming_dir/SBOM.spdx.json" "$source_root/compliance/"
          cp "$incoming_dir/AUDIT_REPORT.md" "$source_root/compliance/"

          printf '%s\n' \
            '# Código-fonte correspondente' \
            '' \
            "Este documento corresponde ao ZYYK Verse ${version}." \
            "O arquivo ${final_name} contém o código do Verse, seus arquivos de build" \
            'e as fontes exatas dos componentes copyleft incorporados ao AppImage.' \
            > "$source_root/compliance/SOURCE_OFFER.md"

          printf '%s\n' \
            "Código-fonte correspondente do ZYYK Verse ${version}" \
            '' \
            'A raiz contém o código do Verse e seus arquivos de build.' \
            'third-party-sources/ contém as fontes correspondentes de terceiros.' \
            'compliance/ contém os avisos, o SBOM e o relatório de auditoria.' \
            > "$source_root/README.txt"
          (
            cd "$source_root"
            find . -type f -print0 \
              | LC_ALL=C sort -z \
              | xargs -0 sha256sum > "$work_dir/SHA256SUMS"
          )
          mv "$work_dir/SHA256SUMS" "$source_root/SHA256SUMS"
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner \
            -czf "$work_dir/$replacement_name" -C "$work_dir" "$(basename "$source_root")"
          test -s "$work_dir/$replacement_name"

          gh release upload "$RELEASE_TAG" "$work_dir/$replacement_name"
          replacement_id="$(gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" \
            --jq ".assets[] | select(.name == \"$replacement_name\") | .id")"
          test -n "$replacement_id"

          gh release delete-asset "$RELEASE_TAG" "$final_name" --yes
          gh api --method PATCH "repos/$GH_REPO/releases/assets/$replacement_id" \
            -f "name=$final_name" >/dev/null

          for obsolete in \
            "$copyleft_name" \
            AUDIT_REPORT.md \
            SBOM.spdx.json \
            SHA256SUMS \
            SOURCE_OFFER.md \
            THIRD_PARTY_NOTICES.md; do
            if gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' \
              | grep -Fxq -- "$obsolete"; then
              gh release delete-asset "$RELEASE_TAG" "$obsolete" --yes
            fi
          done

          remaining="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
          unexpected="$(grep -Ev "^(ZYYK\\.Verse_.*\\.AppImage|${final_name})$" <<<"$remaining" || true)"
          if [[ -n "$unexpected" ]]; then
            echo "Assets inesperados após a normalização:" >&2
            echo "$unexpected" >&2
            exit 1
          fi
          echo "Release $RELEASE_TAG normalizada com aplicação e código-fonte consolidado."
